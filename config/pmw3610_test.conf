# Pointing device / HID de mouse
CONFIG_ZMK_POINTING=y

# Subsistema de input + SPI + driver do sensor PMW3610
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y

# DIAGNOSTICO (temporario, cursor nao mexendo 2026-07-28): log DEFERRED
# (nunca LOG_MODE_IMMEDIATE -- ja travou boot em outro shield deste projeto
# quando combinado com log verboso) + nivel DBG so do modulo do sensor.
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

# Se o log mostrar "Incorrect product id 0xFF (expecting 0x3E)": o sensor
# nao teve tempo de ligar antes do driver falar com ele. Descomente:
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
