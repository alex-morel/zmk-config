# Pointing device / HID de mouse
CONFIG_ZMK_POINTING=y

# Subsistema de input + SPI + driver NATIVO do Zephyr pro sensor PMW3610
# (trocado do fork badjeff/zmk-pmw3610-driver em 2026-07-28: aquele driver
# tinha um init assincrono em varios passos que travava sem nenhum log --
# nem a primeira linha do primeiro passo aparecia. O driver nativo faz o
# init direto/sincrono, mais facil de diagnosticar.)
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_INPUT_PMW3610=y

# DIAGNOSTICO (temporario, cursor nao mexendo 2026-07-28): log DEFERRED
# (nunca LOG_MODE_IMMEDIATE -- ja travou boot em outro shield deste projeto
# quando combinado com log verboso) + nivel DBG do subsistema INPUT (o driver
# nativo usa o log padrao do Zephyr, nao um Kconfig proprio).
CONFIG_INPUT_LOG_LEVEL_DBG=y
