# Config exclusiva do DONGLE (Zephyr aplica <shield>.conf do diretorio do shield).
#
# Mantido ENXUTO de proposito, alinhado com os modulos de referencia
# (carrefinho/prospector-zmk-module e englmaxi/zmk-dongle-display):
# nada de log em producao, memorias nos valores de referencia (ver
# Kconfig.defconfig), animacoes dimensionadas pra banda do SPI.

# BATERIA DESLIGADA: o dongle e alimentado por USB e NAO tem bateria. O overlay
# do board nice!nano define `vbatt` (zmk,battery-nrf-vddh) incondicionalmente,
# e o dongle TRAVAVA na 2a amostragem dos 60s (comprovado por log: parava seco
# em 00:01:00.5). A implementacao do evento de bateria de periferico que some
# junto com esta flag e fornecida no dongle_status_screen.c (ZMK_EVENT_IMPL).
CONFIG_ZMK_BATTERY_REPORTING=n

# Busca a bateria das METADES (perifericos) pra tela. As metades ja enviam
# sozinhas -- nada a mudar nelas. (Mesma config dos modulos de referencia.)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Studio SEM trava: por padrao re-trava ao desconectar e apos 10min parado --
# era por isso que a opcao de salvar sumia. Teclado pessoal, trava = atrito.
CONFIG_ZMK_STUDIO_LOCKING=n

# Metade DIREITA entrando em fiacao (2026-07-20) -> voltou pra 2. Com slots
# configurados > perifericos existentes, o central escaneia BLE pra sempre
# atras de uma metade que nao existe (central.c so para o scan com todos os
# slots conectados) -- por isso ficou em 1 enquanto so a esquerda existia.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Pilha da thread que escreve comandos pro periferico via GATT (default 512,
# apertado). Nao foi a causa do bug do &bootloader, mas 2048 e barato e da
# margem real pra escrita GATT.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048

# DIAGNOSTICO DE MEMORIA (desligado em producao): ligar
# CONFIG_SYS_HEAP_RUNTIME_STATS=y + snippet zmk-usb-logging no build.yaml e o
# dongle_status_screen.c loga o heap do LVGL a cada 10s (alocado/livre/pico).
# Em 2026-07-19 provou heap saudavel (~4,3KB de 16KB) e apontou a corrupcao
# da tela pra camada fisica -- confirmado: era a fiacao dupont, solda resolveu.

# NAO adicionar aqui (ja testados e revertidos durante o debug de 2026-07-18/19):
#  - CONFIG_LOG_MODE_IMMEDIATE=y  -> distorce timing; com LVGL log afoga o boot
#  - CONFIG_LV_USE_LOG=y          -> TOXICO em qualquer modo, trava o boot ate
#                                    com log deferred (comprovado 2026-07-19)
#  - stack do display 8192 / pool 32KB -> nao resolveram; referencia usa 4096/16KB

# >>> TEMPORARIO (2026-09-11): investigando pareamento BLE direto do dongle
# falhando (Linux E Windows). Historico:
#  1) 6 modulos de Bluetooth em DBG de uma vez -> afogou o boot.
#  2) SO SMP -> boot saudavel, mas ZERO atividade em varias tentativas de
#     conexao -- o handshake de pareamento nem comeca, problema esta ANTES.
#  3) SO CONN -> afogou o boot nesse tambem (CONN loga o scan/conexao do
#     split com as 2 metades o tempo todo, e' MUITO mais tagarela que SMP).
# Agora (4): volta o CONN, mas ataca a causa do travamento em vez de tirar
# o modulo -- o buffer de log deferred (CONFIG_LOG_BUFFER_SIZE, default
# pequeno) provavelmente estava enchendo e a thread ficava bloqueada
# esperando espaco (CONFIG_LOG_BLOCK_IN_THREAD), travando o boot de
# verdade em vez de so descartar mensagem velha. Buffer bem maior +
# desliga o bloqueio (descarta mensagem antiga se necessario, nunca trava
# a execucao por causa de log). Tirar tudo isto depois de diagnosticar.
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
# CONFIG_LOG_BLOCK_IN_THREAD is not set
