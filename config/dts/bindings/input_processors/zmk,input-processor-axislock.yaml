# Filtro de "trava de eixo" CUSTOMIZADO deste projeto (nao existe no ZMK
# core) -- suprime o desvio pequeno no eixo secundario quando o movimento
# e claramente dominante no eixo principal, deixando linhas retas mais
# retas sem travar movimento diagonal de verdade.

description: Input Processor que suprime desvio pequeno no eixo secundario (trava de eixo / "move mais reto")

compatible: "zmk,input-processor-axislock"

include: ip_one_param.yaml

properties:
  type:
    type: int
    required: true
  x-code:
    type: int
    required: true
  y-code:
    type: int
    required: true
